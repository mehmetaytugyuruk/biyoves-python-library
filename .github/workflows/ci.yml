name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.7"
            os: ubuntu-22.04
          - python-version: "3.8"
            os: ubuntu-latest
          - python-version: "3.9"
            os: ubuntu-latest
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify installed package and models
        working-directory: /tmp
        run: >-
          python -c "from pathlib import Path; import biyoves;
          models=sorted(p.name for p in (Path(biyoves.__file__).parent/'models').glob('*.onnx'));
          assert models == ['2d106det.onnx', 'det_500m.onnx', 'modnet.onnx'];
          print('biyoves version:', biyoves.__version__)"

      - name: Install test dependencies
        run: >-
          python -m pip install
          "pytest<8; python_version < '3.8'"
          "pytest>=8; python_version >= '3.8'"

      - name: Run tests
        run: python -m pytest tests/ -q
