[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biyoves"
version = "1.3.1"
description = "AI-powered Biometric, Passport, and Visa photo generation library."
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "Mehmet Aytuğ Yürük", email = "myuruk1@ogr.iu.edu.tr"}
]
keywords = [
    "biometric", "passport", "visa", "photo", "background-removal",
    "face-detection", "computer-vision", "print-layout",
    "biyometrik", "vesikalik",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics :: Capture :: Digital Camera",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "opencv-python-headless>=4.5.0",
    "numpy>=1.19.0",
    "onnxruntime>=1.10.0",
    "fpdf2>=2.7.0",
]

[project.urls]
Homepage = "https://github.com/mehmetaytugyuruk/biyoves-python-library"
Documentation = "https://github.com/mehmetaytugyuruk/biyoves-python-library#readme"
Repository = "https://github.com/mehmetaytugyuruk/biyoves-python-library"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["biyoves"]

[tool.setuptools.package-data]
biyoves = ["models/*.onnx"]
